apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki

          image: grafana/loki:3.7.0

          args:
            - -config.file=/etc/loki/loki.yaml

          ports:
            - name: http
              containerPort: 3100

          readinessProbe:
            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 1Gi

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: data
              mountPath: /var/loki

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability

spec:
  selector:
    app: loki

  ports:
    - name: http
      port: 3100
      targetPort: http
