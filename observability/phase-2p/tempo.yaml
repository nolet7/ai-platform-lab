apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      containers:
        - name: tempo

          image: grafana/tempo:3.0.3

          args:
            - -config.file=/etc/tempo/tempo.yaml

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          readinessProbe:
            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 1Gi

          volumeMounts:
            - name: config
              mountPath: /etc/tempo

            - name: data
              mountPath: /var/tempo

      volumes:
        - name: config
          configMap:
            name: tempo-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability

spec:
  selector:
    app: tempo

  ports:
    - name: http
      port: 3200
      targetPort: http

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      port: 4318
      targetPort: otlp-http
