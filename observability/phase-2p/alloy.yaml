apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alloy

  template:
    metadata:
      labels:
        app: alloy

    spec:
      serviceAccountName: alloy

      containers:
        - name: alloy

          image:
            grafana/alloy:v1.19.2

          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data

          ports:
            - name: http
              containerPort: 12345

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: config
              mountPath: /etc/alloy

            - name: data
              mountPath: /var/lib/alloy

      volumes:
        - name: config
          configMap:
            name: alloy-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability

spec:
  selector:
    app: alloy

  ports:
    - name: http
      port: 12345
      targetPort: http
