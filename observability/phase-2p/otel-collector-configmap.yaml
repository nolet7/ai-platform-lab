apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability

data:
  config.yaml: |
    receivers:

      otlp:
        protocols:

          grpc:
            endpoint: 0.0.0.0:4317

          http:
            endpoint: 0.0.0.0:4318


    processors:

      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

      resource:
        attributes:

          - key: k8s.cluster.name
            action: upsert
            value: ai-platform

      batch:
        timeout: 2s


    exporters:

      otlp/tempo:
        endpoint:
          tempo.observability.svc.cluster.local:4317

        tls:
          insecure: true


    extensions:

      health_check:
        endpoint: 0.0.0.0:13133


    service:

      extensions:
        - health_check

      pipelines:

        traces:

          receivers:
            - otlp

          processors:
            - memory_limiter
            - resource
            - batch

          exporters:
            - otlp/tempo
