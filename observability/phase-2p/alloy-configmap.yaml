apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability

data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }


    discovery.kubernetes "pods" {
      role = "pod"
    }


    discovery.relabel "pod_logs" {

      targets =
        discovery.kubernetes.pods.targets


      rule {

        source_labels = [
          "__meta_kubernetes_namespace",
        ]

        target_label =
          "namespace"
      }


      rule {

        source_labels = [
          "__meta_kubernetes_pod_name",
        ]

        target_label =
          "pod"
      }


      rule {

        source_labels = [
          "__meta_kubernetes_pod_container_name",
        ]

        target_label =
          "container"
      }


      rule {

        target_label =
          "cluster"

        replacement =
          "ai-platform"
      }
    }


    loki.source.kubernetes "pods" {

      targets =
        discovery.relabel.pod_logs.output

      forward_to = [
        loki.write.local.receiver,
      ]
    }


    loki.write "local" {

      endpoint {

        url =
          "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
