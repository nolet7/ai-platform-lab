apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-prometheus-to-ai-platform-api
  namespace: ai-platform

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-platform-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability

      ports:
        - protocol: TCP
          port: 9091
