apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-api-dashboard
  namespace: ai-platform
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: ai-platform-api

data:
  ai-platform-api.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Request Rate",
          "id": 1,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(rate(ai_platform_http_requests_total{namespace=\"ai-platform\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Authentication Failures",
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(increase(ai_platform_auth_failures_total{namespace=\"ai-platform\"}[15m]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "RBAC Denials",
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(increase(ai_platform_rbac_denials_total{namespace=\"ai-platform\"}[15m]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API Targets Up",
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"ai-platform\",service=\"ai-platform-api\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests by HTTP Status",
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (status_code) (rate(ai_platform_http_requests_total{namespace=\"ai-platform\"}[5m]))",
              "legendFormat": "HTTP {{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p50 / p95",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50,sum by (le)(rate(ai_platform_http_request_duration_seconds_bucket{namespace=\"ai-platform\"}[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95,sum by (le)(rate(ai_platform_http_request_duration_seconds_bucket{namespace=\"ai-platform\"}[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "ai-platform",
        "fastapi",
        "phase-2o"
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "title": "AI Platform API - Control Plane",
      "uid": "ai-platform-api",
      "version": 1
    }
