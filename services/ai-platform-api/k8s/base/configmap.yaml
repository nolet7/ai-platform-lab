apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-api-config
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-api
data:
  APP_NAME: "AI Platform API"
  APP_ENV: "kubernetes"

  APP_HOST: "0.0.0.0"
  APP_PORT: "8001"

  KEYCLOAK_REALM: "ai-platform"

  KEYCLOAK_ISSUER: "http://127.0.0.1:18080/realms/ai-platform"

  KEYCLOAK_JWKS_URL: "http://keycloak.security.svc.cluster.local:8080/realms/ai-platform/protocol/openid-connect/certs"

  KEYCLOAK_AUDIENCE: "ai-platform-api"
  KEYCLOAK_ALGORITHM: "RS256"
