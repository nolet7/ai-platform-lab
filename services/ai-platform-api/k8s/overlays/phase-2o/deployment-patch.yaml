apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-api
  namespace: ai-platform

spec:
  template:
    spec:
      containers:
        - name: ai-platform-api
          image: ai-platform-api:phase-2o-v2

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

            - name: metrics
              containerPort: 9091
              protocol: TCP
