apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-ai-platform-api-otel
  namespace: ai-platform

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-platform-api

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name:
                observability

      ports:
        - protocol: TCP
          port: 4317
