name: Application CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: application-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: dvc repro
      - run: docker build -t ai-application:test .
      - name: Exercise real inference
        run: |
          docker run -d --name inference -p 18000:8000 ai-application:test
          trap 'docker logs inference; docker rm -f inference' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:18000/health && break
            sleep 2
          done
          curl -fsS http://localhost:18000/predict -H 'Content-Type: application/json' \
            -d '{"item_description":"software subscription","product_category":"software","destination_state":"CA","exemption_certificate":"none","amount":100,"customer_type":"business"}'
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Record immutable release image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deployment image — $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
