apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mlflow-dvc-project
  title: Create an ML project
  description: Create a private GitHub repository with model code, CI, DVC and MinIO storage.
  tags: [python, mlflow, dvc, minio]
spec:
  owner: group:default/platform-team
  type: machine-learning
  parameters:
    - title: Project request
      required: [name, displayName, description]
      properties:
        name:
          title: Repository and model name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,50}$'
          description: A unique name under nolet7; lowercase letters, digits and hyphens.
        displayName:
          title: Project title
          type: string
          maxLength: 100
        description:
          title: Purpose
          type: string
          maxLength: 500
  steps:
    - id: fetch
      name: Prepare the ML golden path
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
    - id: publish
      name: Create private GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?owner=nolet7&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main
        protectDefaultBranch: false
        gitCommitMessage: Initialize ML project from the platform golden path
    - id: register
      name: Register project in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Open project repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open project in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
