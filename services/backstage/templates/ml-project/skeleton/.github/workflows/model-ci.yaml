name: Model CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: dvc repro
      - run: dvc metrics show
# Synthetic data is generated without secrets. Configure a trusted runner for
# private MinIO data; never expose storage credentials to fork pull requests.
