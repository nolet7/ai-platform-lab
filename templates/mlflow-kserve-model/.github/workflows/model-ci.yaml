name: Model CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
# After implementing training and configuring approved remote credentials,
# add dvc pull, dvc repro, and git diff --exit-code -- dvc.lock reports/.
# Never expose remote credentials to untrusted pull requests.
