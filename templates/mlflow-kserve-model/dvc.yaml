stages:
  generate:
    cmd: python src/generate_data.py --output data/raw/mock-tax-transactions-v1.csv --rows ${rows} --seed ${seed}
    deps:
      - src/generate_data.py
    params:
      - rows
      - seed
    outs:
      - data/raw/mock-tax-transactions-v1.csv
  evaluate:
    cmd: python src/evaluate.py --data data/raw/mock-tax-transactions-v1.csv --model-output models/model.joblib --metrics-output reports/metrics.json --minimum-macro-f1 ${minimum_macro_f1}
    deps:
      - data/raw/mock-tax-transactions-v1.csv
      - src/train.py
      - src/evaluate.py
    params:
      - minimum_macro_f1
      - dataset_version
    outs:
      - models/model.joblib
    metrics:
      - reports/metrics.json:
          cache: false
