apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mlflow-postgres

spec:
  serviceName: mlflow-postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-postgres
        app.kubernetes.io/component: metadata-store

    spec:
      containers:
        - name: postgres
          image: ai-platform-postgres:16-alpine
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: mlflow-postgres-credentials

          ports:
            - name: postgres
              containerPort: 5432

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: standard

        resources:
          requests:
            storage: 5Gi
