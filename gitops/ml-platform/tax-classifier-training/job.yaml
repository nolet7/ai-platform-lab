apiVersion: batch/v1
kind: Job

metadata:
  name: tax-document-classifier-train-v1

  labels:
    app.kubernetes.io/name: tax-document-classifier
    app.kubernetes.io/component: training
    app.kubernetes.io/part-of: ai-platform

spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: tax-document-classifier
        app.kubernetes.io/component: training
        app.kubernetes.io/part-of: ai-platform

    spec:
      restartPolicy: Never

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: trainer

          image: ai-platform-tax-classifier-training:0.1.0
          imagePullPolicy: IfNotPresent

          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.ml-platform.svc.cluster.local:5000

            - name: MLFLOW_EXPERIMENT_NAME
              value: tax-document-classifier-training

            - name: REGISTERED_MODEL_NAME
              value: tax-document-classifier

            - name: MODEL_ALIAS
              value: candidate

            - name: DATASET_VERSION
              value: synthetic-demo-v1

            - name: SOURCE_REPOSITORY
              value: https://github.com/nolet7/ai-platform-lab.git

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: training-data
              mountPath: /app/data

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: training-data
          emptyDir: {}

        - name: tmp
          emptyDir: {}
