apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: tax-document-classifier-training-egress

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tax-document-classifier
      app.kubernetes.io/component: training

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow

      ports:
        - protocol: TCP
          port: 5000
