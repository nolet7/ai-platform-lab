apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: tax-document-classifier-training-egress

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tax-document-classifier
      app.kubernetes.io/component: training

  policyTypes:
    - Egress

  egress:

    # Kubernetes DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    # MLflow Tracking + Model Registry
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow

      ports:
        - protocol: TCP
          port: 5000

    # MinIO S3 artifact storage
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio

      ports:
        - protocol: TCP
          port: 9000
