apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-platform

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: platform-api
      app.kubernetes.io/component: control-api
      app.kubernetes.io/part-of: ai-platform-control-plane
      app.kubernetes.io/managed-by: argocd
