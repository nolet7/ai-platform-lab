apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-platform

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

  - postgres-service.yaml
  - postgres-statefulset.yaml
  - postgres-networkpolicy.yaml

  - migration-networkpolicy.yaml
  - migration-job.yaml

  - orchestrator

labels:
  - pairs:
      app.kubernetes.io/part-of: ai-platform-control-plane
      app.kubernetes.io/managed-by: argocd


configMapGenerator:
  - name: argocd-api-trust
    files:
      - ca.crt=ai-platform-root-ca.crt

generatorOptions:
  disableNameSuffixHash: true
