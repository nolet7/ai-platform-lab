apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: deployment-dispatcher

spec:
  podSelector:
    matchLabels:
      app: deployment-dispatcher

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: platform-redis

      ports:
        - protocol: TCP
          port: 6379

    - to:
        - podSelector:
            matchLabels:
              app: platform-postgres

      ports:
        - protocol: TCP
          port: 5432

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53
