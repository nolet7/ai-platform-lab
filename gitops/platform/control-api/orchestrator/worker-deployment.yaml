apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: deployment-worker

  template:
    metadata:
      labels:
        app: deployment-worker

    spec:
      serviceAccountName: deployment-orchestrator
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: ai-platform-deployment-worker:0.3.10
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -m
            - app.worker

          envFrom:
            - configMapRef:
                name: deployment-orchestrator-config

            - secretRef:
                name: platform-db-secret

            - secretRef:
                name: platform-queue-secret
     
            - secretRef:
                name: gitops-github-writer

            - secretRef:
                name: caipe-agent-auth

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp


      volumes:
        - name: tmp
          emptyDir: {}
