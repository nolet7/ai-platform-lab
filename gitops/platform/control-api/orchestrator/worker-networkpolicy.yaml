apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: deployment-worker

spec:
  podSelector:
    matchLabels:
      app: deployment-worker

  policyTypes:
    - Egress

  egress:
    # Allow worker to reach Redis queue
    - to:
        - podSelector:
            matchLabels:
              app: platform-redis

      ports:
        - protocol: TCP
          port: 6379

    # Allow worker to reach PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: platform-postgres

      ports:
        - protocol: TCP
          port: 5432

    # Allow DNS resolution through CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    # Allow outbound HTTPS for GitHub GitOps publishing
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0

      ports:
        - protocol: TCP
          port: 443
