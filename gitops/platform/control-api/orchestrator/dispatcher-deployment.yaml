apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-dispatcher

spec:
  replicas: 1

  selector:
    matchLabels:
      app: deployment-dispatcher

  template:
    metadata:
      labels:
        app: deployment-dispatcher

    spec:
      serviceAccountName: deployment-orchestrator
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dispatcher
          image: ai-platform-deployment-worker:0.3.7
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -m
            - app.dispatcher

          envFrom:
            - configMapRef:
                name: deployment-orchestrator-config

            - secretRef:
                name: platform-db-secret

            - secretRef:
                name: platform-queue-secret

            - secretRef:
                name: argocd-api-observer

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: argocd-api-trust
              mountPath: /etc/ai-platform-ca
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        - name: argocd-api-trust
          configMap:
            name: argocd-api-trust
