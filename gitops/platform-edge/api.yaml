apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ai-platform-api-tls
  namespace: ai-platform
spec:
  secretName: ai-platform-api-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - api.ai-platform.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: ai-platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
