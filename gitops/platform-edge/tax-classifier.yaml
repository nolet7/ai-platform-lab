apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tax-classifier-edge-tls
  namespace: ml-platform
spec:
  secretName: tax-classifier-edge-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - tax-classifier.ai-platform.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: ai-platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tax-classifier-clean-url
  namespace: ml-platform
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tax-classifier.ai-platform.local
      secretName: tax-classifier-edge-tls
  rules:
    - host: tax-classifier.ai-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tax-document-classifier-predictor
                port:
                  number: 80
