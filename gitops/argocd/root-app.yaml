apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nolet7/ai-platform-lab.git
    targetRevision: main
    path: gitops/argocd/applications

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
