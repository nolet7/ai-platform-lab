apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ml-platform-mlflow
  namespace: argocd

spec:
  project: ai-platform-ml

  source:
    repoURL: https://github.com/nolet7/ai-platform-lab.git
    targetRevision: main
    path: gitops/ml-platform/mlflow

  destination:
    server: https://kubernetes.default.svc
    namespace: ml-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
