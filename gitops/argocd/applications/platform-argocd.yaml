apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: ai-platform-argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.0
      helm:
        releaseName: argocd
        skipCrds: true
        valueFiles:
          - $values/gitops/platform-infrastructure/argocd/values.yaml
    - repoURL: https://github.com/nolet7/ai-platform-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - Prune=false
