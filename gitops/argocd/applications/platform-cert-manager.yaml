apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-cert-manager
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-30"

spec:
  project: ai-platform-infrastructure

  source:
    repoURL: https://github.com/nolet7/ai-platform-lab.git
    targetRevision: main
    path: gitops/platform-infrastructure/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
