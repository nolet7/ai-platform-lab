apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tax-document-classifier-tax-ml-team-staging-serving
  namespace: argocd
spec:
  project: ai-platform-ml
  source:
    repoURL: https://github.com/nolet7/ai-platform-lab.git
    targetRevision: main
    path: gitops/ml-platform/releases/tax-document-classifier/tax-ml-team/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
