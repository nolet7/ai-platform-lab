name: GitOps Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "gitops/**"
      - "observability/**"
      - "services/deployment-worker/**"
      - "services/platform-api/**"
      - "services/caipe-agent/**"
      - "scripts/configure_portal_oidc.py"
      - "scripts/check_gitops_secrets.py"
      - "platform/model-catalog.json"
      - "templates/**"
      - "scripts/scaffold_model.py"
      - "scripts/tests/**"
      - "scripts/validate_model_catalog.py"
      - ".github/workflows/gitops-validate.yaml"

  push:
    branches:
      - main
    paths:
      - "gitops/**"
      - "observability/**"
      - "services/deployment-worker/**"
      - "services/platform-api/**"
      - "services/caipe-agent/**"
      - "scripts/configure_portal_oidc.py"
      - "scripts/check_gitops_secrets.py"
      - "platform/model-catalog.json"
      - "templates/**"
      - "scripts/scaffold_model.py"
      - "scripts/tests/**"
      - "scripts/validate_model_catalog.py"
      - ".github/workflows/gitops-validate.yaml"

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.37.0"

      - name: Check changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff-tree --check -r "${{ github.sha }}"
          fi

      - name: Validate all GitOps Kustomizations
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            directory="$(dirname "${file}")"

            echo "::group::kubectl kustomize ${directory}"
            kubectl kustomize "${directory}" >/dev/null
            echo "::endgroup::"

            count=$((count + 1))
          done < <(
            find gitops observability \
              -type f \
              -name kustomization.yaml \
              -print0
          )

          if [[ "${count}" -eq 0 ]]; then
            echo "ERROR: no Kustomizations found"
            exit 1
          fi

          echo "Validated ${count} Kustomization directories."

      - name: Validate model catalog
        run: |
          python3 scripts/validate_model_catalog.py
          cmp platform/model-catalog.json services/platform-api/model-catalog.json
          cmp platform/model-catalog.json services/deployment-worker/model-catalog.json

      - name: Validate YAML and reject inline Secret payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/gitops-validation
          /tmp/gitops-validation/bin/pip install --disable-pip-version-check PyYAML==6.0.3
          /tmp/gitops-validation/bin/python scripts/check_gitops_secrets.py
      - name: Reject committed PEM private keys
        shell: bash
        run: |
          set -euo pipefail

          prefix='-----BEGIN '
          suffix='(RSA |EC |OPENSSH )?PRIVATE KEY-----'
          pattern="${prefix}${suffix}"

          if git grep -nE \
            "${pattern}" \
            -- . \
            ':!.github/workflows/gitops-validate.yaml'
          then
            echo "ERROR: private key material detected in Git."
            exit 1
          fi

          echo "PASS: no PEM private keys detected."


  worker-tests:
    name: Deployment worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install httpx pytest
      - name: Test deployment worker
        working-directory: services/deployment-worker
        run: python -m pytest -q tests


  portal-tests:
    name: Control API and portal tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r services/platform-api/requirements.txt pytest httpx
      - name: Test control API and portal
        working-directory: services/platform-api
        env:
          DATABASE_URL: postgresql+psycopg://x:x@localhost/test
        run: python -m pytest -q tests


  caipe-agent-tests:
    name: CAIPE A2A and MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install agent SDKs and test dependencies
        run: python -m pip install -r services/caipe-agent/requirements.txt pytest
      - name: Test agent protocol and authorization
        working-directory: services/caipe-agent
        env:
          CAIPE_AGENT_KIND: argo
          CAIPE_INTERNAL_TOKEN: test-only-token
        run: python -m pytest -q tests

  scaffold-tests:
    name: Independent model scaffold tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q scripts/tests/test_scaffold_model.py
